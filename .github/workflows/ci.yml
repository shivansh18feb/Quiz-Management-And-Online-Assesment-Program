name: Quiz Management Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-and-test:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quiz_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend with Maven
        run: mvn clean test -B
        working-directory: ./quiz-platform-backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/quiz_platform
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          JWT_SECRET: quiz-platform-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm

      - name: Package Spring Boot Application Jar
        run: mvn package -DskipTests -B
        working-directory: ./quiz-platform-backend

  frontend-build-and-lint:
    name: Build & Lint Frontend (React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./quiz-platform-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./quiz-platform-frontend

      - name: Type Check & Build Frontend
        run: npm run build
        working-directory: ./quiz-platform-frontend

  docker-build:
    name: Build Docker Container Images
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build-and-lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./quiz-platform-backend
          file: ./quiz-platform-backend/Dockerfile
          push: false
          tags: quiz-platform-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./quiz-platform-frontend
          file: ./quiz-platform-frontend/Dockerfile
          push: false
          tags: quiz-platform-frontend:latest
